# Local development and CI tests. Production uses the `prod` target of the same Dockerfile (see deploy/compose.yml).
services:
  app:
    build:
      context: .
      target: dev
    # run as the host user so files created in the bind mount (vendor/, var/, coverage/) are yours
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      # coverage is needed for `composer test`; use "debug,coverage" for step debugging
      XDEBUG_MODE: ${XDEBUG_MODE:-coverage}
      PHP_IDE_CONFIG: serverName=Docker
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./:/app
    ports:
      - "16880:8080"
